name: ci
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: pip install pyyaml
      - name: scaffold selftest
        run: python scaffold.py --selftest
      - name: runtime selftest
        run: python run.py --selftest
      - name: agent-agnostic proof (no agent needed)
        run: python test_agnostic.py
      - name: governor guarantees (resume, classify, gates)
        run: python test_governor.py
