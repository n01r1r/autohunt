[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autohunt"
version = "0.1.0"
description = "A deterministic governor for agent-agnostic task loops"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.scripts]
autohunt = "autohunt_cli:main"
autohunt-agent = "agent:main"

[tool.setuptools]
py-modules = ["autohunt_cli", "agent", "run", "scaffold"]
